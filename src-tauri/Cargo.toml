[package]
name = "velo-browser"
version = "0.1.0"
description = "Velo lightweight desktop web browser built with Tauri v2"
edition = "2021"

[lib]
name = "velo_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
